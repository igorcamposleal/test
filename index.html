<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="registration-form" novalidate>
    <h1>Create an account</h1>

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name">
      <span class="error" id="name-error" role="alert"></span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <span class="error" id="email-error" role="alert"></span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password">
      <span class="error" id="password-error" role="alert"></span>
    </div>

    <button type="submit">Register</button>
    <p id="success" class="success" hidden>Registration successful!</p>
  </form>

  <script src="validators.js"></script>
  <script src="script.js"></script>
</body>
</html>
